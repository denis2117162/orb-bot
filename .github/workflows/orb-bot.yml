name: ORB options bot (paper)

# Times are UTC for Pacific/Eastern STANDARD time; move every cron one hour earlier on 2027-03-14.
# Many start attempts on purpose: GitHub's scheduler can run late or skip. Each run is the same "auto" job:
# the first to start waits for 9:35 ET and enters; later ones queue behind it (one trading run at a time) and
# take over managing positions; the run that reaches 15:45 ET closes everything.
on:
  schedule:
    - cron: "7 12 * * 1-5"
    - cron: "37 12 * * 1-5"
    - cron: "7 13 * * 1-5"
    - cron: "37 13 * * 1-5"
    - cron: "7 14 * * 1-5"
    - cron: "7 16 * * 1-5"
    - cron: "37 16 * * 1-5"
    - cron: "7 17 * * 1-5"
    - cron: "37 17 * * 1-5"
    - cron: "7 18 * * 1-5"
    - cron: "37 18 * * 1-5"
    - cron: "7 19 * * 1-5"
    - cron: "37 19 * * 1-5"
    - cron: "7 20 * * 1-5"
    - cron: "37 20 * * 1-5"
  workflow_dispatch:
    inputs:
      phase:
        description: "auto, dry, status, morning, afternoon or close"
        default: "dry"

# One trading run at a time (morning, afternoon, close share a lock); status/dry runs are separate.
concurrency:
  group: ${{ (github.event_name == 'schedule' || contains('auto morning afternoon close', inputs.phase)) && 'orb-trading' || format('orb-{0}', inputs.phase) }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick phase
        id: p
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then echo "phase=auto" >> $GITHUB_OUTPUT;
          else echo "phase=${{ inputs.phase }}" >> $GITHUB_OUTPUT; fi
      - name: Run bot
        env:
          MODE: PAPER
          RISK_PER_TRADE: "0.03"
          VIRTUAL_START: "10000"
          VIRTUAL_SINCE: "2026-11-27"
          SHADOW_START: "2000"
          SHADOW_SINCE: "2026-11-25"
          MIN_ONE_MULT: "1.5"
          SYMBOLS: "SPY,QQQ,IWM"
          EXPERIMENT_SYMBOLS: ""
          DAILY_LOSS_LIMIT: "0.03"
          TIME_STOP_MIN: "90"
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python orb_bot.py ${{ steps.p.outputs.phase }}
